<style>
:root{--bg:#0c1512;--card:#14211c;--line:#243630;--ink:#e8efe9;--mute:#8da396;--pink:#e8a0b4;--gold:#e9c46a;--leaf:#6fb88a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Georgia,"Iowan Old Style",serif;min-height:100vh;padding:18px 14px 50px}
.w{max-width:1040px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:22px;font-weight:400}.sub{color:var(--mute);font-size:13px}
button,input,select,textarea{font:inherit;color:var(--ink)}
.tabs{display:flex;gap:6px}.tab,.chip{background:none;border:1px solid var(--line);color:var(--mute);padding:7px 14px;border-radius:20px;cursor:pointer;font-size:14px;transition:all .2s}
.tab.on,.chip.on{background:var(--leaf);border-color:var(--leaf);color:#0b1411}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:thin}
.d{flex:none;width:58px;text-align:center;padding:8px 0;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--card);position:relative;transition:transform .2s,border-color .2s}
.d:hover{transform:translateY(-2px)}.d b{display:block;font-size:18px;font-weight:400}.d small{font-size:11px;color:var(--mute)}
.d.on{border-color:var(--gold);background:#1b2e25}.d i{position:absolute;left:8px;right:8px;bottom:4px;height:3px;border-radius:2px;background:var(--line)}.d i u{display:block;height:100%;background:var(--leaf);border-radius:2px}
.grid{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
@media(max-width:760px){.grid{grid-template-columns:1fr}.side{order:-1}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.side{position:sticky;top:12px;text-align:center}
.pct{font-size:32px}.timer{font-size:38px;letter-spacing:2px;margin:10px 0 2px}
.btn{background:var(--leaf);color:#0b1411;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
.btn.g{background:none;border:1px solid var(--line);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.c{justify-content:center;margin-top:8px}
.next{margin:8px 0;color:var(--gold);font-size:14px}
.blk{border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#0f1b16;transition:opacity .3s,box-shadow .4s}
.blk.done{opacity:.5}.blk.pop{box-shadow:0 0 0 6px rgba(233,196,106,.25)}
.bh{display:flex;gap:10px;align-items:center}.bh input[type=checkbox]{accent-color:var(--leaf);width:20px;height:20px;flex:none}
.bt{flex:1;cursor:pointer}.blk.done .bt b{text-decoration:line-through}.bt small{display:block;color:var(--mute);font-size:12px}
.ed{margin-top:10px;display:grid;gap:8px}
.in,.ed input,.ed select,.ed textarea,.add input,.add select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.ed .row>*{flex:1}.lg{border-top:1px dashed var(--line);padding-top:8px;margin-top:4px}
.it{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}.it small{color:var(--mute)}
.x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:18px}
.tag{font-size:11px;border:1px solid var(--line);border-radius:10px;padding:1px 7px;color:var(--mute);margin-left:4px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:10px 0}.stat div{background:#0f1b16;border:1px solid var(--line);border-radius:10px;padding:10px}.stat b{font-size:24px;font-weight:400;display:block}
.bars{display:flex;gap:4px;align-items:flex-end;height:110px;margin:10px 0}.bars div{flex:1;background:var(--leaf);border-radius:4px 4px 0 0;min-height:3px;cursor:pointer;transition:height .5s}
.fly{position:fixed;width:4px;height:4px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);opacity:0;animation:fl 9s linear infinite;pointer-events:none}
@keyframes fl{0%{transform:translateY(105vh);opacity:0}20%,80%{opacity:.6}100%{transform:translateY(-5vh) translateX(40px);opacity:0}}
.lotus{animation:br 6s ease-in-out infinite}@keyframes br{50%{transform:scale(1.04)}}
.pt{transform-origin:100px 130px;transition:opacity .8s,transform .8s}
@media(prefers-reduced-motion:reduce){.fly,.lotus{animation:none}*{transition:none!important}}
textarea{width:100%;min-height:90px}.rw{display:flex;gap:12px;align-items:center;padding:12px 4px}.rwrap{border-bottom:1px solid var(--line)}.rwrap:last-of-type{border:0}.rwrap .ed{padding:0 4px 12px}.rw.done .bt{opacity:.45}.rw.done .bt b{text-decoration:line-through}.tm{width:48px;color:var(--mute);font-size:13px;flex:none}.br{width:4px;align-self:stretch;border-radius:2px;flex:none;transition:box-shadow .4s}.rw input[type=checkbox]{accent-color:var(--leaf);width:18px;height:18px;flex:none}.rwrap.pop .br{box-shadow:0 0 10px var(--gold)}.pb{height:6px;background:var(--line);border-radius:4px;margin:6px 0 10px}.pb u{display:block;height:100%;background:var(--leaf);border-radius:4px;transition:width .5s}.nt{font-size:13px;text-align:left;margin:6px 0;line-height:1.6}h3{font-weight:400;font-size:16px;margin:12px 0 4px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>

our story is still being written.","A single good habit can change a year.","Be gentle with yourself and keep going.","The next step is always small enough to take.","Keep learning, keep building.","You have what it takes to figure it out.","Hard problems are just unfinished ones.","Show up for the version of you that you are becoming.","Gratitude turns effort into joy.","Light shows up when you keep walking.","Your best work comes from steady days.","Believe in the work you have already done.","Stay curious about what you do not know yet.","Make today a little better than yesterday.","You are not behind; you are on your path.","Slow growth is still growth.","Build with patience and purpose.","Bloom where you are planted."];

function perm(){var a=[],i,r=7;for(i=0;i<365;i++)a.push(i);function rnd(){r|=0;r=r+0x6D2B79F5|0;var t=Math.imul(r^r>>>15,1|r);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}for(i=364;i>0;i--){var j=Math.floor(rnd()*(i+1)),x=a[i];a[i]=a[j];a[j]=x}return a}

function tm(m){var h=Math.floor(m/60);return(h<10?"0":"")+h+":"+(m%60<10?"0":"")+m%60}

function $(i){return document.getElementById(i)}

 return s+'<circle cx="100" cy="116" r="'+(6+o*8)+'" fill="#e9c46a"/>'}

 if(pa){st+='<div class="strip">';for(var i=-3;i<=10;i++){var k=add(TD,i),dd=new Date(k+"T12:00:00");st+='<div class="d'+(k==cur?" on":"")+'" data-a="go" data-k="'+k+'"><small>'+(i==0?"Today":dd.toLocaleDateString(undefined,{weekday:"short"}))+'</small><b>'+dd.getDate()+'</b><i><u style="width:'+pc(k)+'%"></u></i></div>'}st+='</div><div class="row" style="margin-bottom:10px"><input type="date" class="in" value="'+cur+'" data-a="jump"><button class="btn g" data-a="copy">Copy previous day here</button></div>'}

    '<div class="row" style="margin-top:8px"><select id="pi">'+D.ideas.map(function(x){return'<option>'+esc(x.n)+'</option>'}).join("")+'</select><input id="po" placeholder="What did you build today?"><button class="btn" data-a="pa">Add</button></div></div>'}
   ex+='</div>'}

 return'<div class="grid">'+side+'<div class="card">'+st+h+'</div></div>'}

 h+='<div class="bars">'+ks.map(function(k){return'<div title="'+k+": "+pc(k)+'%" data-a="go2" data-k="'+k+'" style="height:'+Math.max(3,pc(k))+'%"></div>'}).join("")+'</div>';
 h+='<h3>DSA topics</h3><div>'+(Object.keys(tp).map(function(t){return'<span class="tag">'+esc(t)+" "+tp[t]+'</span>'}).join("")||'<span class="sub">No problems logged in this range.</span>')+'</div>';
 h+='<h3>Days</h3>'+ks.slice().reverse().map(function(k){var d=D.days[k];if(!d)return"";var dn=d.b.filter(function(b){return b.d}).map(function(b){return esc(b.n)}).join(", ");return'<div class="it"><span><a href="#" data-a="go2" data-k="'+k+'" style="color:var(--leaf)">'+new Date(k+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})+'</a> <small>'+(dn||"nothing completed")+(d.dsa.length?"; "+d.dsa.length+" DSA":"")+'</small></span><span>'+pc(k)+'%</span></div>'}).join("");
 h+='<h3>Project log</h3>'+(pj.map(function(x){return'<div class="it"><span>'+esc(x[1].i)+'<small> '+esc(x[1].o)+'</small></span><small>'+x[0]+'</small></div>'}).join("")||'<span class="sub">No project updates in this range.</span>');
 if(exp)h+='<h3>Backup</h3><textarea id="bk" aria-label="Backup data">'+esc(expText(ks))+'</textarea><div class="row" style="margin-top:6px"><button class="btn" data-a="imp">Restore from text above</button></div>';
 return h+'</div>'}
var hv=7,pa=false;
function nt(y){if(!D.topics[y])return"";var L=D.topics[y],x=L.filter(function(z){return z.s=="learning"})[0]||L.filter(function(z){return z.s=="todo"})[0];return x?x.n:""}
function rescale(d){var old=d.b,nw=gen();nw.forEach(function(b){var o=old.filter(function(x){return x.y==b.y&&!x.u})[0];if(o){b.d=o.d;b.n=o.n;o.u=1}});old.forEach(function(o){delete o.u});old.filter(function(o){return o.y=="oth"}).forEach(function(o){nw.push(o)});d.b=nw}
function q(s){return'"'+String(s).replace(/"/g,'""')+'"'}
function expText(ks){if(exp=="open")return JSON.stringify(D);var o=[];
if(exp=="csv"){o.push("date,type,item,detail");ks.forEach(function(k){var d=D.days[k];if(!d)return;d.b.forEach(function(b){o.push([k,"block",b.n,b.d?"done":"open"].map(q).join(","))});d.dsa.forEach(function(x){o.push([k,"dsa",x.n,x.t+" "+x.f+" "+x.s].map(q).join(","))});d.proj.forEach(function(x){o.push([k,"project",x.i,x.o].map(q).join(","))})});return o.join("\\n")}
ks.forEach(function(k){var d=D.days[k];if(!d)return;o.push(k+" ("+pc(k)+"%)");d.b.forEach(function(b){o.push("  ["+(b.d?"x":" ")+"] "+b.n)});d.dsa.forEach(function(x){o.push("  DSA: "+x.n+" - "+x.t+", "+x.f+", "+x.s)});d.proj.forEach(function(x){o.push("  Project: "+x.i+" - "+x.o)})});return o.join("\\n")}
function nextTopics(){return'<div class="nt"><b>Up next</b><br>'+Object.keys(TL).map(function(t){var L=D.topics[t],x=L.filter(function(y){return y.s=="learning"})[0]||L.filter(function(y){return y.s=="todo"})[0];return TL[t]+": "+(x?esc(x.n):"all done")}).join("<br>")+'</div>'}
function topics(){return Object.keys(TL).map(function(t){var L=D.topics[t],dn=L.filter(function(x){return x.s=="done"}).length;
return'<div class="card" style="margin-bottom:14px"><b>'+TL[t]+'</b> <span class="sub">'+dn+" of "+L.length+' done</span><div class="pb"><u style="width:'+(L.length?dn/L.length*100:0)+'%"></u></div>'+L.map(function(x,i){return(t=="sd"&&x.l&&(i==0||L[i-1].l!=x.l)?'<div class="sub" style="margin:14px 0 4px">'+esc(x.l)+'</div>':"")+'<div class="blk" style="--c:'+(x.s=="done"?"#6fb88a":x.s=="learning"?"#e9c46a":"#8da396")+'"><div class="row"><span style="flex:1"><b>'+esc(x.n)+'</b>'+(x.d?'<small class="sub" style="display:block;margin-top:2px">'+esc(x.d)+'</small>':"")+'</span>'+sel(["todo","learning","done"],x.s,'data-a="ts" data-t="'+t+'" data-i="'+i+'"')+'<button class="x" data-a="tdl" data-t="'+t+'" data-i="'+i+'" aria-label="Remove topic">&times;</button></div><textarea class="in" style="min-height:56px;margin-top:8px" placeholder="Notes" data-a="tn" data-t="'+t+'" data-i="'+i+'">'+esc(x.note)+'</textarea></div>'}).join("")+'<div class="row add"><input id="tn_'+t+'" placeholder="Add a topic" style="flex:1"><button class="btn" data-a="ta" data-t="'+t+'">Add</button></div></div>'}).join("")}

function ideas(){return'<div class="card"><div class="row add" style="margin-bottom:10px"><input id="ni" placeholder="New project idea" style="flex:1"><button class="btn" data-a="ia">Add idea</button></div>'+(D.ideas.map(function(x,i){return'<div class="blk" style="--c:'+(x.s=="shipped"?"#6fb88a":x.s=="building"?"#e9c46a":"#8da396")+'"><div class="row"><b style="flex:1">'+esc(x.n)+'</b>'+sel(["idea","building","shipped"],x.s,'data-a="is" data-i="'+i+'"')+'<button class="x" data-a="id" data-i="'+i+'" aria-label="Remove idea">&times;</button></div><input class="in" style="width:100%;margin-top:8px" placeholder="Notes" value="'+esc(x.note)+'" data-a="in" data-i="'+i+'"><div class="sub" style="margin-top:6px">'+projLog(x.n)+'</div></div>'}).join("")||'<span class="sub">No ideas yet. Add the next thing you want to build.</span>')+'</div>'}
function projLog(n){var c=0,l="";Object.keys(D.days).sort().forEach(function(k){D.days[k].proj.forEach(function(x){if(x.i==n){c++;l=k}})});return c?c+" updates, last on "+l:"No progress logged yet"}

function draw(){var t=[["plan","Plan"],["topics","Topics"],["hist","History"],["ideas","Ideas"]];$("tabs").innerHTML=t.map(function(x){return'<button class="tab'+(view==x[0]?" on":"")+'" data-a="tab" data-v="'+x[0]+'">'+x[1]+'</button>'}).join("");
 $("app").innerHTML=view=="plan"?plan():view=="topics"?topics():view=="hist"?hist():ideas();sv()}
function blk(id){return day(cur).b.filter(function(b){return b.id==id})[0]}
function val(i){var e=$(i);return e?e.value.trim():""}
document.addEventListener("click",function(e){var el=e.target.closest("[data-a]");if(!el)return;var a=el.dataset.a,i=el.dataset.i,d=day(cur);
 if(el.tagName=="A")e.preventDefault();
 if(a=="tab"){view=el.dataset.v}else if(a=="go"){cur=el.dataset.k;op=null}else if(a=="go2"){cur=el.dataset.k;view="plan";op=null}
 else if(a=="hrs"){D.hours=+el.dataset.v;rescale(day(cur))}else if(a=="pv"){cur=add(cur,-1);op=null}else if(a=="nx2"){cur=add(cur,1);op=null}else if(a=="pa"){pa=!pa}else if(a=="copy"){var pv=D.days[add(cur,-1)];if(pv){d.b=pv.b.map(function(b){return{id:"b"+(uid++)+Math.random().toString(36).slice(2,6),t:b.t,m:b.m,n:b.n,y:b.y,d:0}})}}
 else if(a=="op"){op=op==i?null:i}else if(a=="nb"){var nb={id:"b"+(uid++)+Math.random().toString(36).slice(2,6),t:d.b.length?Math.max.apply(null,d.b.map(function(b){return b.t+b.m}))+15:480,m:45,n:"New block",y:"oth",d:0};d.b.push(nb);op=nb.id}
 else if(a=="del"){d.b=d.b.filter(function(b){return b.id!=i});op=null}
 else if(a=="da"){if(!val("dn"))return;d.dsa.push({n:val("dn"),t:$("dtp").value,f:$("dfi").value,s:$("dst").value,l:val("dl"),o:val("do")})}
 else if(a=="dd"){d.dsa.splice(+el.dataset.j,1)}
 else if(a=="pa"){if(!val("po")||!$("pi"))return;d.proj.push({i:$("pi").value,o:val("po")})}else if(a=="pd"){d.proj.splice(+el.dataset.j,1)}
 else if(a=="ia"){if(!val("ni"))return;D.ideas.push({n:val("ni"),s:"idea",note:""})}else if(a=="id"){D.ideas.splice(+i,1)}
 else if(a=="hv"){hv=+el.dataset.v}else if(a=="exp"){exp=exp==el.dataset.v?"":el.dataset.v}
 else if(a=="imp"){try{var n=JSON.parse($("bk").value);if(n&&n.days){D=n;exp=""}}catch(x){alert("That text is not valid backup data.")}}
 else if(a=="ta"){var tr=el.dataset.t,nv=val("tn_"+tr);if(!nv)return;D.topics[tr].push({n:nv,s:"todo",note:"",l:tr=="sd"?"Added by you":undefined})}else if(a=="tdl"){D.topics[el.dataset.t].splice(+i,1)}
 else if(a=="rs"){clearInterval(iv);iv=null;timer=1500}
 else return;draw()});
document.addEventListener("click",function(e){if(e.target.id=="go"){var b=e.target;if(iv){clearInterval(iv);iv=null;b.textContent="Resume"}else{b.textContent="Pause";iv=setInterval(function(){if(timer>0){timer--;var t=$("tm");if(t)t.textContent=tm(Math.floor(timer/60)).slice(3)+":"+(timer%60<10?"0":"")+timer%60}else{clearInterval(iv);iv=null;timer=1500;draw()}},1000)}}});
document.addEventListener("change",function(e){var el=e.target,a=el.dataset.a,i=el.dataset.i;if(!a)return;var d=day(cur),b=i&&view=="plan"?blk(i):null;
 if(a=="tk"){b.d=el.checked?1:0;draw();if(el.checked){var r=document.querySelectorAll(".rwrap");r.forEach(function(x){if(x.querySelector('[data-i="'+i+'"]'))x.classList.add("pop")})}return}
 if(a=="st"){b.t=pm(el.value)}else if(a=="mn"){b.m=Math.max(5,+el.value||5)}else if(a=="nm"){b.n=el.value||b.n}else if(a=="ty"){b.y=el.value}
 else if(a=="jump"){if(el.value){cur=el.value;op=null}}
 else if(a=="ts"){D.topics[el.dataset.t][+i].s=el.value}else if(a=="tn"){D.topics[el.dataset.t][+i].note=el.value}else if(a=="is"){D.ideas[+i].s=el.value}else if(a=="in"){D.ideas[+i].note=el.value}else return;draw()});
draw();
</script>
